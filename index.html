<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KING MASTER</title>
<meta name="theme-color" content="#080808">
<meta name="description" content="KING MASTER Official Telegram Channel">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    background:
        radial-gradient(ellipse at top, rgba(180,0,0,.20), transparent 65%),
        #080808;
}

.card {
    width: 100%;
    max-width: 400px;
    padding: 27px 22px 23px;
    text-align: center;
    background: linear-gradient(145deg, #1b0808, #0c0c0c);
    border: 1px solid rgba(255,55,55,.45);
    border-radius: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,.8),
                0 0 30px rgba(220,0,0,.12);
    animation: fadeIn .7s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

.brand {
    display: inline-block;
    margin-bottom: 14px;
    padding: 7px 16px;
    color: #ff7777;
    background: rgba(255,30,30,.08);
    border: 1px solid rgba(255,70,70,.35);
    border-radius: 30px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
}

.badge {
    margin-bottom: 23px;
    padding: 10px;
    color: #fff;
    background: linear-gradient(90deg,#350707,#8d1010,#350707);
    border: 1px solid rgba(255,100,100,.3);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .6px;
}

.avatar {
    position: relative;
    width: 155px;
    height: 155px;
    margin: 0 auto 23px;
}

.ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(
        #ff2525,
        #ffffff,
        #a00000,
        #ff5555,
        #ff2525
    );
    animation: spin 6s linear infinite;
    box-shadow: 0 0 25px rgba(255,30,30,.3);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.logo-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 5px;
    overflow: hidden;
    border: 4px solid #100606;
    border-radius: 50%;
    background: #000;
}

.logo-inner img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
}

.name {
    margin-bottom: 9px;
    color: #fff;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255,30,30,.35);
}

.subtitle {
    margin-bottom: 21px;
    color: #ff6464;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
}

.chart {
    height: 42px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    margin-bottom: 22px;
}

.candle {
    width: 9px;
    border-radius: 2px;
    background: linear-gradient(to top,#a00000,#ff6464);
    animation: candleMove 1.5s ease-in-out infinite;
}

.candle:nth-child(1) { height: 18px; }
.candle:nth-child(2) { height: 30px; animation-delay: .1s; }
.candle:nth-child(3) { height: 23px; animation-delay: .2s; }
.candle:nth-child(4) { height: 38px; animation-delay: .3s; }
.candle:nth-child(5) { height: 27px; animation-delay: .4s; }
.candle:nth-child(6) { height: 34px; animation-delay: .5s; }
.candle:nth-child(7) { height: 41px; animation-delay: .6s; }

@keyframes candleMove {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(.75); }
}

.features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 23px;
}

.feature {
    padding: 8px 11px;
    color: #ffc5c5;
    background: rgba(255,40,40,.07);
    border: 1px solid rgba(255,80,80,.3);
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
}

.cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 18px;
    border: 0;
    border-radius: 50px;
    background: linear-gradient(135deg,#ff3535,#cf0000,#850000);
    color: #fff;
    font-family: 'Poppins',sans-serif;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 5px 25px rgba(255,20,20,.3);
    transition: .2s ease;
    animation: pulse 2.2s ease-in-out infinite;
}

.cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,20,20,.45);
}

.telegram-icon {
    width: 21px;
    height: 21px;
    fill: currentColor;
    flex-shrink: 0;
}

@keyframes pulse {
    0%,100% { box-shadow: 0 5px 20px rgba(255,20,20,.22); }
    50% { box-shadow: 0 7px 30px rgba(255,20,20,.45); }
}

.join-text {
    margin-top: 13px;
    color: rgba(255,255,255,.55);
    font-size: 10px;
}

.join-text span {
    color: #ff6464;
    font-weight: 800;
}

.divider {
    margin: 20px 0 13px;
    border: 0;
    border-top: 1px solid rgba(255,70,70,.2);
}

.footer {
    color: rgba(255,255,255,.4);
    font-size: 9px;
    line-height: 1.7;
}

@media(max-width:360px) {
    .card { padding: 23px 17px; }
    .name { font-size: 25px; }
    .avatar { width: 135px; height: 135px; }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="card">

    <div class="brand">KING MASTER</div>

    <div class="badge">
        👑 KING MASTER • OFFICIAL CHANNEL
    </div>

    <div class="avatar">
        <div class="ring"></div>

        <div class="logo-inner">
            <img
                src="king-master-logo.jpg"
                alt="KING MASTER Logo"
                width="145"
                height="145"
            >
        </div>
    </div>

    <h1 class="name">KING MASTER</h1>

    <div class="subtitle">
        WELCOME TO OUR OFFICIAL CHANNEL
    </div>

    <div class="chart" aria-hidden="true">
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
    </div>

    <div class="features">
        <div class="feature">👑 KING MASTER</div>
        <div class="feature">📢 TELEGRAM CHANNEL</div>
        <div class="feature">🔔 CHANNEL UPDATES</div>
    </div>

    <a
        class="cta"
        href="https://t.me/+jBztwPs2Vz45ZDY9"
        target="_blank"
        rel="noopener noreferrer"
    >
        <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.8 3.2a1.5 1.5 0 0 0-1.6-.3L2.8 9.5c-1.2.5-1.2 1.2-.2 1.5l4.5 1.4 1.7 5.3c.2.6.1.8.7.8.5 0 .7-.2.9-.4l2.2-2.2 4.6 3.4c.8.5 1.4.3 1.6-.8l3-14.2c.2-.8-.2-1.3-.8-1.1ZM9.1 12.1l9.2-5.8c.5-.3.9-.1.5.2l-7.6 7-.3 3.2-1.8-4.6Z"/>
        </svg>
        JOIN TELEGRAM CHANNEL
    </a>

    <div class="join-text">
        Tap the button above to <span>JOIN NOW</span>
    </div>

    <hr class="divider">

    <div class="footer">
        KING MASTER<br>
        Visit our official Telegram channel for updates.
    </div>

</main>

</body>
</html>
