<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING MASTER</title>

<meta name="theme-color" content="#080808">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: linear-gradient(180deg, #1b1b1b, #090909);
    border: 1px solid #e50914;
    border-radius: 20px;
    padding: 35px 24px;
    box-shadow: 0 0 30px rgba(229, 9, 20, 0.25);
}

.logo {
    width: 125px;
    height: 125px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ff1722;
    box-shadow: 0 0 20px rgba(255, 23, 34, 0.45);
}

.logo video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h1 {
    color: #ff1722;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.subtitle {
    color: #dddddd;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.badge {
    display: inline-block;
    background: rgba(229, 9, 20, 0.12);
    border: 1px solid #e50914;
    color: #ff343d;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 22px;
}

.join-button {
    display: block;
    width: 100%;
    background: linear-gradient(90deg, #e50914, #ff303a);
    color: #ffffff;
    text-decoration: none;
    padding: 16px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 5px 18px rgba(229, 9, 20, 0.25);
}

.join-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
}

.countdown {
    margin-top: 22px;
    color: #bbbbbb;
    font-size: 14px;
    line-height: 1.7;
}

#timer {
    color: #ff1722;
    font-size: 22px;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    padding-top: 16px;
    border-top: 1px solid #292929;
    color: #777777;
    font-size: 11px;
}

@media (max-width: 360px) {
    h1 {
        font-size: 25px;
    }

    .container {
        padding: 28px 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <video autoplay muted loop playsinline preload="auto">
            <source src="1000604516.mp4" type="video/mp4">
        </video>
    </div>

    <div class="badge">WELCOME TO KING MASTER</div>

    <h1>KING MASTER</h1>

    <p class="subtitle">
        Join our official Telegram channel for the latest updates.
    </p>

    <a
        class="join-button"
        href="https://t.me/+jBztwPs2Vz45ZDY9"
        id="joinButton"
    >
        JOIN TELEGRAM
    </a>

    <div class="countdown">
        Redirecting to Telegram in<br>
        <span id="timer">30</span> seconds
    </div>

    <div class="footer">
        KING MASTER
    </div>

</div>

<script>
const telegramLink = "https://t.me/+jBztwPs2Vz45ZDY9";
let seconds = 30;

const timerElement = document.getElementById("timer");

const countdown = setInterval(function () {
    seconds--;
    timerElement.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = telegramLink;
    }
}, 1000);
</script>

</body>
</html>
