<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:18px;font-family:Arial,Helvetica,sans-serif;color:#fff;
background:radial-gradient(ellipse at top,rgba(180,0,0,.20),transparent 65%),#080808
}
.card{
width:100%;max-width:400px;padding:28px 22px 23px;text-align:center;
background:linear-gradient(145deg,#210808,#090909);
border:1px solid rgba(255,55,55,.45);border-radius:25px;
box-shadow:0 25px 70px rgba(0,0,0,.8),0 0 30px rgba(220,0,0,.12);
animation:fadeIn .7s ease
}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.brand{
display:inline-block;margin-bottom:15px;padding:7px 16px;color:#ff7777;
background:rgba(255,30,30,.08);border:1px solid rgba(255,70,70,.35);
border-radius:30px;font-size:10px;font-weight:800;letter-spacing:2px
}
.badge{
margin-bottom:24px;padding:10px;color:#fff;
background:linear-gradient(90deg,#350707,#8d1010,#350707);
border:1px solid rgba(255,100,100,.3);border-radius:12px;
font-size:11px;font-weight:800;letter-spacing:.6px
}
.avatar{
width:155px;height:155px;margin:0 auto 24px;padding:5px;
border-radius:50%;
background:conic-gradient(#ff2525,#fff,#a00000,#ff5555,#ff2525);
box-shadow:0 0 25px rgba(255,30,30,.3)
}
.avatar img{
display:block;width:100%;height:100%;object-fit:cover;
object-position:center;border:4px solid #100606;
border-radius:50%;background:#000
}
h1{
margin-bottom:9px;color:#fff;font-size:30px;line-height:1.2;
font-weight:800;letter-spacing:1px;
text-shadow:0 0 20px rgba(255,30,30,.35)
}
.subtitle{
margin-bottom:23px;color:#ff6464;font-size:10px;
font-weight:800;letter-spacing:1.2px
}
.chart{
height:42px;display:flex;align-items:flex-end;
justify-content:center;gap:6px;margin-bottom:23px
}
.candle{
width:9px;border-radius:2px;
background:linear-gradient(to top,#a00000,#ff6464);
animation:candleMove 1.5s ease-in-out infinite
}
.candle:nth-child(1){height:18px}
.candle:nth-child(2){height:30px;animation-delay:.1s}
.candle:nth-child(3){height:23px;animation-delay:.2s}
.candle:nth-child(4){height:38px;animation-delay:.3s}
.candle:nth-child(5){height:27px;animation-delay:.4s}
.candle:nth-child(6){height:34px;animation-delay:.5s}
.candle:nth-child(7){height:41px;animation-delay:.6s}
@keyframes candleMove{
0%,100%{transform:scaleY(1)}
50%{transform:scaleY(.75)}
}
.features{
display:flex;flex-wrap:wrap;justify-content:center;
gap:8px;margin-bottom:23px
}
.feature{
padding:8px 10px;color:#ffc5c5;background:rgba(255,40,40,.07);
border:1px solid rgba(255,80,80,.3);border-radius:9px;
font-size:9px;font-weight:700
}
.join{
display:flex;align-items:center;justify-content:center;gap:9px;
width:100%;padding:16px 12px;border:0;border-radius:50px;
background:linear-gradient(135deg,#ff3535,#cf0000,#850000);
color:#fff;text-decoration:none;font-size:13px;font-weight:800;
box-shadow:0 5px 25px rgba(255,20,20,.3);
transition:transform .2s ease,box-shadow .2s ease;
animation:pulse 2.2s ease-in-out infinite
}
.join:hover{
transform:translateY(-2px);
box-shadow:0 8px 30px rgba(255,20,20,.45)
}
.telegram-icon{width:21px;height:21px;fill:currentColor;flex-shrink:0}
@keyframes pulse{
0%,100%{box-shadow:0 5px 20px rgba(255,20,20,.22)}
50%{box-shadow:0 7px 30px rgba(255,20,20,.45)}
}
.note{margin-top:13px;color:rgba(255,255,255,.55);font-size:10px}
.note span{color:#ff6464;font-weight:800}
hr{margin:21px 0 14px;border:0;border-top:1px solid rgba(255,70,70,.2)}
.footer{color:rgba(255,255,255,.4);font-size:9px;line-height:1.7}
@media(max-width:360px){
.card{padding:23px 17px}
.avatar{width:135px;height:135px}
h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
